    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="BM Industries Flipbook">
    <meta name="author" content="Shreyash Srivastva">
    <title>BM Industries Flipbook</title>
    <style>
        :root {
            /* --- THEME COLORS --- */
            --brand-green: #00c853;
            /* Vibrant Green */
            --brand-green-glow: rgba(0, 200, 83, 0.4);

            /* Dark Mode Defaults */
            --bg-color: #000000;
            --text-color: #ffffff;
            --page-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            --control-bg: rgba(0, 0, 0, 0.8);
            perspective: 2000px;
        }

        [data-theme="light"] {
            /* Light Mode Defaults */
            --bg-color: #f0f7f4;
            /* Very subtle mint-white */
            --text-color: #333333;
            --page-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            --control-bg: rgba(255, 255, 255, 0.9);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.1s;
            touch-action: manipulation;
        }

        /* --- Click Navigation Zones (Invisible) --- */
        .nav-zone {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 500;
            cursor: pointer;
        }

        .nav-zone.left {
            left: 0;
        }

        .nav-zone.right {
            right: 0;
        }

        /* Optional: Show a subtle arrow when hovering the sides on PC */
        .nav-zone:hover {
            background: linear-gradient(to right, rgba(0, 200, 83, 0.05), transparent);
        }

        .nav-zone.right:hover {
            background: linear-gradient(to left, rgba(0, 200, 83, 0.05), transparent);
        }

        /* --- The Stage (Scaler) --- */
        #scaler {
            width: 1920px;
            height: 1080px;
            position: relative;
            flex-shrink: 0;
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        /* --- The Book --- */
        .book {
            width: 100%;
            height: 100%;
            position: relative;
            perspective: 4000px;
        }

        /* --- The Pages --- */
        .page {
            position: absolute;
            transform-origin: left center;
            transform-style: preserve-3d;
            transform: rotateY(0deg);
            transition: 1.5s;
            backface-visibility: hidden;
            background-color: white;
            box-shadow: 0 0 5px 0 rgba(25, 25, 25, 0.25);
            border-radius: 0 5px 5px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page:nth-child(1) {
            transform: rotateY(0deg);
        }

        .page:nth-child(2) {
            transform: rotateY(0deg);
        }

        .page:nth-child(3) {
            transform: rotateY(0deg);
        }

        .page:nth-child(4) {
            transform: rotateY(0deg);
        }

        .page:nth-child(5) {
            transform: rotateY(0deg);
        }

        .page:nth-child(6) {
            transform: rotateY(0deg);
            overflow: hidden;
        }

        .page:nth-child(6)::after {
            content: '';
            width: 210px;
            height: 300px;
            position: absolute;
            top: 0px;
            right: 0%;
            transform-origin: center;
            transform: rotateY(180deg);
            background-size: 420px 300px;
            background-position: 100% -2px;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            image-rendering: -webkit-optimize-contrast;
            border-radius: 4px;
        }

        .page.flipped {
            transform: rotateY(-180deg) rotateX(20deg);
            transform-origin: left;
            opacity: 0;
            backface-visibility: hidden;
            pointer-events: none;
        }

        /* Z-Index logic handled by JS, but defaults provided */
        .page:nth-child(1) {
            z-index: 10;
        }

        .page:nth-child(2) {
            z-index: 9;
        }

        .page:nth-child(3) {
            z-index: 8;
        }

        .page:nth-child(4) {
            z-index: 7;
        }

        .page:nth-child(5) {
            z-index: 6;
        }

        .page:nth-child(6) {
            z-index: 5;
        }

        .page:nth-child(7) {
            z-index: 4;
        }

        .page:nth-child(8) {
            z-index: 3;
        }

        .page:nth-child(9) {
            z-index: 2;
        }

        .page:nth-child(10) {
            z-index: 1;
        }

        .page:nth-child(11) {
            z-index: 0;
        }

        /* --- Creative Controls --- */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--control-bg);
            padding: 12px 35px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            transition: background 0.3s;
        }

        .btn {
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--brand-green);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--brand-green);
            color: white;
            box-shadow: 0 0 15px var(--brand-green-glow);
            transform: scale(1.1);
        }

        .btn:disabled {
            border-color: #ccc;
            color: #ccc;
            background: transparent;
            cursor: default;
            box-shadow: none;
            transform: none;
        }

        #counter {
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: 600;
            min-width: 60px;
            text-align: center;
            user-select: none;
            letter-spacing: 1px;
        }

        /* --- Styled Theme Toggle --- */
        .theme-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            background: var(--brand-green);
            /* Always Green */
            color: rgb(0, 0, 0);
            /* Always White Icon */
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.4rem;
            z-index: 2000;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .theme-toggle:hover {
            transform: scale(1.15) rotate(-35deg);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="nav-zone left" onclick="changePage(-1)" title="Previous Page"></div>
    <div class="nav-zone right" onclick="changePage(1)" title="Next Page"></div>

    <button class="theme-toggle" onclick="toggleTheme()" title="">
        🌞
    </button>

    <div id="scaler">
        <div class="book">
            <div class="page"><img src="images/1.png" alt="Page"></div>
            <div class="page"><img src="images/2.png" alt="Page"></div>
            <div class="page"><img src="images/3.png" alt="Page"></div>
            <div class="page"><img src="images/4.png" alt="Page"></div>
            <div class="page"><img src="images/5.png" alt="Page"></div>
            <div class="page"><img src="images/6.png" alt="Page"></div>
            <div class="page"><img src="images/7.png" alt="Page"></div>
            <div class="page"><img src="images/8.png" alt="Page"></div>
            <div class="page"><img src="images/9.png" alt="Page"></div>
            <div class="page"><img src="images/10.png" alt="Page"></div>
            <div class="page"><img src="images/11.png" alt="Page"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="prev" onclick="changePage(-1)">‹</button>
        <span id="counter">1 / 11</span>
        <button class="btn" id="next" onclick="changePage(1)">›</button>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 11;
        const pages = document.querySelectorAll('.page');
        const counter = document.getElementById('counter');
        const scaler = document.getElementById('scaler');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const toggleBtn = document.querySelector('.theme-toggle');

        function updateUI() {
            counter.innerText = `${currentPage} / ${totalPages}`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }

        function changePage(dir) {
            const nextIdx = currentPage + dir;
            if (nextIdx < 1 || nextIdx > totalPages) return;

            if (dir > 0) {
                pages[currentPage - 1].classList.add('flipped');
            } else {
                pages[currentPage - 2].classList.remove('flipped');
            }

            currentPage = nextIdx;
            updateUI();
        }

        // --- Responsive Scaling ---
        function resize() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const targetW = 1920;
            const targetH = 1080;
            const padding = 0.95;

            const scaleX = (windowWidth * padding) / targetW;
            const scaleY = (windowHeight * padding) / targetH;
            const scale = Math.min(scaleX, scaleY);

            scaler.style.transform = `scale(${scale})`;
        }

        // --- Swipe Logic ---
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) changePage(1);
            if (touchEndX > touchStartX + 50) changePage(-1);
        });

        // --- Theme Logic ---
        function toggleTheme() {
            const body = document.body;
            const theme = body.getAttribute('data-theme');

            if (theme === 'light') {
                body.setAttribute('data-theme', 'dark');
                toggleBtn.innerHTML = '🌞'; // Sun icon for when it's dark
            } else {
                body.setAttribute('data-theme', 'light');
                toggleBtn.innerHTML = '⭐'; // Moon icon for when it's light
            }
        }

        window.addEventListener('resize', resize);

        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") changePage(1);
            if (e.key === "ArrowLeft") changePage(-1);
        });

        // Start
        resize();
        updateUI();
    </script>
</body>

</html>
